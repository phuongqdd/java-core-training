spring.application.name=search-specification

spring.datasource.url=jdbc:mysql://localhost:3306/search?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=

# Hibernate qu?n lý schema
spring.jpa.hibernate.ddl-auto=update

# Hi?n th? SQL log
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialect m?i trong Hibernate 6
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Jackson: tránh l?i khi serialize LAZY entity
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false